[project]
name = "qurd"
version = "0.1.0"
description = "Framework for benchmarking model fingerprinting schemes"
requires-python = ">=3.12.3,<3.13"
dependencies = [
    "datasets>=3.2.0,<4",
    "foolbox>=3.3.1,<4",
    "huggingface-hub>=0.28.0,<0.29",
    "numba>=0.59.1,<0.60",
    "plotly>=6.0.0,<7",
    "polars>=1.22.0,<2",
    "python-dotenv>=1.0.1,<2",
    "scikit-image>=0.25.1,<0.26",
    "scikit-learn>=1.6.1,<2",
    "scipy>=1.15.1,<2",
    "setuptools>=75.8.0,<76",
    "timm>=1.0.14,<2",
    "torch>=2.5.1,<3",
    "torchmetrics>=1.6.1,<2",
    "torchvision>=0.20.1,<0.21",
    "typer-slim>=0.15.1,<0.16",
]
